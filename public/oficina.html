<title>Oficina Equipo Nasdaq</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Vista 3D isométrica de la oficina a la izquierda; parte del equipo a la derecha (debajo en el móvil).
   Un solo mundo: sala de operaciones de noche, grafito y latón. */
:root {
  --fondo: #0f1318;
  --panel: #161c23;
  --panel-2: #1c242d;
  --linea: #2a3440;
  --texto: #e7ecf1;
  --suave: #93a0ae;
  --laton: #c9a46a;
  --verde: #3ecf8e;
  --ambar: #f0b04a;
  --rojo: #ef5b5b;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--fondo); color: var(--texto); }
body { font-family: var(--sans); font-size: 14px; line-height: 1.45; }
.envoltura {
  max-width: 1440px; margin: 0 auto;
  padding-block: 18px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px;
}
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
.marca { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-weight: 600; font-size: clamp(1.25rem, 2.4vw, 1.6rem); margin: 0; letter-spacing: -0.01em; }
h1 b { color: var(--laton); font-weight: 600; }
.reloj { font-family: var(--mono); color: var(--suave); font-size: 13px; font-variant-numeric: tabular-nums; }
.ayuda { color: var(--suave); margin: 0; font-size: 13px; }
.contenido { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
@media (max-width: 980px) { .contenido { grid-template-columns: minmax(0, 1fr); } }
.escena { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--linea); background: #11161c; aspect-ratio: 16 / 10; max-width: 100%; }
@media (max-width: 600px) { .escena { aspect-ratio: 4 / 5; } }
#lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#etiquetas { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.etq {
  position: absolute; transform: translate(-50%, -100%); white-space: nowrap;
  background: rgba(15, 19, 24, .82); border: 1px solid rgba(255, 255, 255, .08); border-radius: 4px;
  padding: 2px 7px 2px 6px; font-size: 11px; font-weight: 500; display: flex; align-items: center; gap: 6px;
  color: var(--texto); pointer-events: auto; cursor: pointer;
}
.etq i { width: 7px; height: 7px; border-radius: 50%; background: var(--verde); }
.etq.trabajando i { background: var(--ambar); }
.etq.alerta { border-color: var(--rojo); }
.etq.alerta i { background: var(--rojo); box-shadow: 0 0 0 3px rgba(239, 91, 91, .25); }
.etq.sel { border-color: var(--laton); }
.controles { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.controles button, .vistas button {
  background: rgba(22, 28, 35, .9); color: var(--texto); border: 1px solid var(--linea); border-radius: 6px;
  font: 500 12px var(--sans); padding: 6px 9px; cursor: pointer;
}
.controles button:hover, .vistas button:hover { border-color: var(--laton); }
.controles button:focus-visible, .vistas button:focus-visible, li button:focus-visible { outline: 2px solid var(--laton); outline-offset: 2px; }
.vistas { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; right: 10px; }
.vistas button[aria-pressed="true"] { border-color: var(--laton); color: var(--laton); }
aside { background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.cab h2 { font-size: 15px; font-weight: 600; margin: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; padding: 3px 8px; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.verde { color: var(--verde); background: rgba(62, 207, 142, .1); }
.pill.ambar { color: var(--ambar); background: rgba(240, 176, 74, .1); }
.pill.rojo { color: var(--rojo); background: rgba(239, 91, 91, .12); }
.meta { color: var(--suave); font-size: 12px; margin: 0; }
.aviso-demo { border: 1px dashed var(--linea); color: var(--suave); border-radius: 6px; padding: 7px 9px; font-size: 12px; margin: 0; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
li button {
  width: 100%; text-align: left; background: var(--panel-2); border: 1px solid transparent; border-radius: 6px;
  color: var(--texto); font: inherit; padding: 8px 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; cursor: pointer;
}
li button:hover { border-color: var(--linea); }
li button[aria-pressed="true"] { border-color: var(--laton); }
.nombre { font-weight: 600; }
.lugar { color: var(--suave); font-size: 12px; }
.chip { font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; border-radius: 3px; padding: 2px 6px; align-self: start; }
.chip.alerta { background: rgba(239, 91, 91, .14); color: var(--rojo); }
.chip.trabajando { background: rgba(240, 176, 74, .12); color: var(--ambar); }
.chip.descanso { background: rgba(62, 207, 142, .1); color: var(--verde); }
.mensaje { grid-column: 1 / 3; color: var(--suave); font-size: 12.5px; overflow-wrap: anywhere; }
li button[aria-pressed="true"] .mensaje { color: var(--texto); }
.sin3d { position: absolute; inset: 0; display: grid; place-items: center; color: var(--suave); padding: 20px; text-align: center; }
</style>

<div class="envoltura">
  <header>
    <div class="marca">
      <h1>Oficina <b>Equipo Nasdaq</b></h1>
      <span class="reloj" id="reloj"></span>
    </div>
    <p class="ayuda">Arrastra para girar, rueda o pellizco para acercar. Toca a una persona para ver qué está haciendo.</p>
  </header>
  <div class="contenido">
    <div class="escena" id="escena">
      <canvas id="lienzo" aria-label="Oficina en 3D con los agentes trabajando o descansando"></canvas>
      <div id="etiquetas"></div>
      <div class="controles">
        <button type="button" id="girar-izq" aria-label="Girar a la izquierda">⟲</button>
        <button type="button" id="girar-der" aria-label="Girar a la derecha">⟳</button>
        <button type="button" id="centrar">Vista general</button>
      </div>
      <div class="vistas" id="vistas"></div>
    </div>
    <aside>
      <div class="cab">
        <h2 id="titulo-equipo">Equipo Nasdaq</h2>
        <span id="semaforo" class="pill verde">Tranquilo</span>
      </div>
      <p class="meta" id="actualizado">Cargando…</p>
      <p class="aviso-demo" id="aviso-demo" hidden>Ejemplo: esta vista no está conectada a la oficina, así que muestra un día inventado.</p>
      <ul id="lista"></ul>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  // ───────────────────────── Datos ─────────────────────────
  const AGENTES = [
    { id: 'coordinador', nombre: 'Coordinadora', rol: 'Junta los avisos y te escribe', ropa: 0x2c3e66, piel: 0xe3b48f, pelo: 0x2b1d14, pantalon: 0x22252b, largo: true },
    { id: 'estructura', nombre: 'Estructura', rol: 'Niveles de tu estrategia', ropa: 0x7a2e3a, piel: 0xa8714e, pelo: 0x15100c, pantalon: 0x2a2d33 },
    { id: 'volumen', nombre: 'Volumen', rol: 'Volumen frente a lo normal', ropa: 0x3d5a4a, piel: 0x7c4f33, pelo: 0x0f0b09, pantalon: 0x26292e, largo: true },
    { id: 'volatilidad', nombre: 'Volatilidad y rango', rol: 'VIX, ATR y movimiento esperado', ropa: 0x5b6470, piel: 0xdba684, pelo: 0x4a3222, pantalon: 0x1f2227 },
    { id: 'noticias', nombre: 'Noticias', rol: 'Titulares que mueven el Nasdaq', ropa: 0x9a7b4f, piel: 0xf3d6bd, pelo: 0xc89b54, pantalon: 0x2b2e35, largo: true },
    { id: 'macro', nombre: 'Macro', rol: 'Calendario económico', ropa: 0x1f2d3d, piel: 0xb98563, pelo: 0x231812, pantalon: 0x3a3f47 },
    { id: 'fed', nombre: 'Fed', rol: 'Discursos, actas y tipos', ropa: 0xe9e6df, piel: 0xf0cfb0, pelo: 0x8a5a33, pantalon: 0x30343c },
    { id: 'earnings', nombre: 'Resultados', rol: 'Nvidia, Apple, Microsoft...', ropa: 0x6b3f69, piel: 0x8d5b3c, pelo: 0x120d0a, pantalon: 0x262a30, largo: true },
    { id: 'cuentas', nombre: 'Gestor de cuentas', rol: 'Límites de tus cuentas', ropa: 0x4b4f8a, piel: 0xcf9c78, pelo: 0x2e2018, pantalon: 0x23262c },
    { id: 'bienestar', nombre: 'Coach', rol: 'Cómo estás hoy', ropa: 0x2f7a6d, piel: 0xe8bb98, pelo: 0x5c3a22, pantalon: 0x1c1f24, largo: true },
  ]

  const EJEMPLO = {
    ejemplo: true, equipos: ['Nasdaq'], semaforo: 'ambar', actualizado: new Date().toISOString(),
    agentes: {
      coordinador: { estado: 'trabajando', mensaje: 'Te ha mandado el aviso del barrido de Asia.' },
      estructura: { estado: 'alerta', mensaje: 'Ha barrido el mínimo de Asia (21.034) a las 15:42. Todavía no ha recuperado el nivel.' },
      volumen: { estado: 'trabajando', mensaje: 'Entra volumen: 1,9 veces lo normal a esta hora.' },
      macro: { estado: 'trabajando', mensaje: '14:30 CPI. Evita abrir posiciones desde 15 min antes.' },
      fed: { estado: 'alerta', mensaje: 'A las 16:00 habla Kevin Warsh (presidente de la Fed).' },
      earnings: { estado: 'trabajando', mensaje: 'Nvidia presenta resultados hoy después del cierre.' },
      volatilidad: { estado: 'descanso', mensaje: 'El NQ se mueve de media unos 300 puntos al día. VIX en 17,2.' },
      noticias: { estado: 'descanso', mensaje: 'Nada relevante en la última media hora.' },
      bienestar: { estado: 'descanso', mensaje: 'Aptitud 85/100: has dormido 7 h y has entrenado.' },
      cuentas: { estado: 'descanso', mensaje: 'Tienes 5 cuentas activas: 3 fondeadas y 2 en challenge.' },
    },
  }

  const escenaEl = document.getElementById('escena')
  if (!window.THREE) {
    escenaEl.insertAdjacentHTML('beforeend', '<div class="sin3d">No se ha podido cargar el motor 3D. Revisa la conexión a internet y recarga la página.</div>')
  }

  // ───────────────────────── Plano (metros) ─────────────────────────
  // Fila norte: sala de operaciones, despacho de la coordinadora, sala de reuniones.
  // Pasillo. Fila sur: zona de descanso, gimnasio, terraza con jardín y piscina.
  const SALAS = {
    operaciones: { x0: 0, x1: 20, z0: 0, z1: 11, nombre: 'Sala de operaciones', suelo: 'roble', puerta: 10 },
    despacho: { x0: 20, x1: 28, z0: 0, z1: 11, nombre: 'Despacho', suelo: 'claro', puerta: 24, vidrio: true },
    reuniones: { x0: 28, x1: 38, z0: 0, z1: 11, nombre: 'Sala de reuniones', suelo: 'claro', puerta: 33, vidrio: true },
    descanso: { x0: 0, x1: 13, z0: 13, z1: 25, nombre: 'Zona de descanso', suelo: 'moqueta', puerta: 6.5 },
    gimnasio: { x0: 13, x1: 21, z0: 13, z1: 25, nombre: 'Gimnasio', suelo: 'caucho', puerta: 17 },
    terraza: { x0: 21, x1: 38, z0: 13, z1: 25, nombre: 'Terraza y piscina', suelo: 'tarima', puerta: 26, abierta: true },
  }
  const PASILLO_Z = 12

  // Puestos de trabajo
  const PUESTOS = {}
  const ordenMesas = ['estructura', 'volatilidad', 'volumen', 'noticias', 'macro', 'fed', 'earnings', 'cuentas']
  ordenMesas.forEach((id, i) => {
    const col = i % 4, fila = Math.floor(i / 4)
    PUESTOS[id] = { x: 3 + col * 4.5, z: 3 + fila * 4.6, rot: 0, sala: 'operaciones' }
  })
  PUESTOS.coordinador = { x: 24, z: 4, rot: 0, sala: 'despacho' }
  PUESTOS.bienestar = { x: 19, z: 22.6, rot: Math.PI, sala: 'gimnasio' }

  // Sitios de descanso: pose = sentado | de pie | tumbado | nadando | andando (cinta)
  const SITIOS = [
    { x: 2.6, z: 21.6, rot: 0, pose: 'sentado', sala: 'descanso', que: 'sofá' },
    { x: 3.6, z: 21.6, rot: 0, pose: 'sentado', sala: 'descanso', que: 'sofá' },
    { x: 4.6, z: 21.6, rot: 0, pose: 'sentado', sala: 'descanso', que: 'sofá' },
    { x: 9.8, z: 15.4, rot: 0, pose: 'de pie', sala: 'descanso', que: 'café' },
    { x: 11.0, z: 15.4, rot: 0, pose: 'de pie', sala: 'descanso', que: 'café' },
    { x: 8.7, z: 21.6, rot: -Math.PI / 2, pose: 'sentado', sala: 'descanso', que: 'mesa' },
    { x: 10.5, z: 21.6, rot: Math.PI / 2, pose: 'sentado', sala: 'descanso', que: 'mesa' },
    { x: 15.0, z: 16.5, rot: 0, pose: 'andando', sala: 'gimnasio', que: 'cinta' },
    { x: 16.6, z: 20.6, rot: Math.PI / 2, pose: 'de pie', sala: 'gimnasio', que: 'estiramientos' },
    { x: 23.2, z: 23.2, rot: Math.PI, pose: 'tumbado', sala: 'terraza', que: 'tumbona' },
    { x: 25.0, z: 23.2, rot: Math.PI, pose: 'tumbado', sala: 'terraza', que: 'tumbona' },
    { x: 31.5, z: 18.5, rot: 0, pose: 'nadando', sala: 'terraza', que: 'piscina' },
    { x: 36.2, z: 14.95, rot: Math.PI, pose: 'sentado', sala: 'terraza', que: 'banco' },
    { x: 31.0, z: 6.0, rot: -Math.PI / 2, pose: 'sentado', sala: 'reuniones', que: 'reunión' },
    { x: 34.6, z: 6.0, rot: Math.PI / 2, pose: 'sentado', sala: 'reuniones', que: 'reunión' },
  ]

  const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches
  let datos = EJEMPLO
  let seleccionado = null

  // ───────────────────────── Panel ─────────────────────────
  const lista = document.getElementById('lista')
  const ORDEN = { alerta: 0, trabajando: 1, descanso: 2 }
  const TEXTO_ESTADO = { alerta: 'Aviso', trabajando: 'Trabajando', descanso: 'Descansando' }
  const SEMAFORO = { verde: 'Tranquilo', ambar: 'Atención', rojo: 'Riesgo alto' }
  const estadoDe = id => {
    const a = datos.agentes?.[id]
    return { estado: ['alerta', 'trabajando', 'descanso'].includes(a?.estado) ? a.estado : 'descanso', mensaje: a?.mensaje || 'Sin novedades.' }
  }

  function pintarPanel() {
    const s = datos.semaforo in SEMAFORO ? datos.semaforo : 'verde'
    const pill = document.getElementById('semaforo')
    pill.className = `pill ${s}`
    pill.textContent = SEMAFORO[s]
    document.getElementById('titulo-equipo').textContent = `Equipo ${(datos.equipos ?? ['Nasdaq']).join(' + ')}`
    document.getElementById('aviso-demo').hidden = !datos.ejemplo
    const cuando = new Date(datos.actualizado)
    document.getElementById('actualizado').textContent = Number.isNaN(cuando.getTime()) ? 'Sin datos todavía'
      : `Actualizado a las ${cuando.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid' })} (hora de España)`
    const filas = AGENTES.map(a => ({ a, ...estadoDe(a.id) })).sort((x, y) => ORDEN[x.estado] - ORDEN[y.estado])
    lista.replaceChildren(...filas.map(({ a, estado, mensaje }) => {
      const li = document.createElement('li')
      const b = document.createElement('button')
      b.type = 'button'
      b.id = `agente-${a.id}`
      b.setAttribute('aria-pressed', String(seleccionado === a.id))
      b.innerHTML = `<span><span class="nombre"></span><br><span class="lugar"></span></span><span class="chip ${estado}">${TEXTO_ESTADO[estado]}</span><span class="mensaje"></span>`
      b.querySelector('.nombre').textContent = a.nombre
      const p = personas.find(p => p.id === a.id)
      b.querySelector('.lugar').textContent = p ? `${a.rol} · ${p.lugarTexto()}` : a.rol
      b.querySelector('.mensaje').textContent = mensaje
      b.addEventListener('click', () => seleccionar(a.id, true))
      li.append(b)
      return li
    }))
  }

  function reloj() {
    document.getElementById('reloj').textContent = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Europe/Madrid' }) + ' Madrid'
  }
  reloj(); setInterval(reloj, 1000)

  const personas = []
  if (!window.THREE) { pintarPanel(); return }

  // ───────────────────────── Motor ─────────────────────────
  const lienzo = document.getElementById('lienzo')
  const renderer = new THREE.WebGLRenderer({ canvas: lienzo, antialias: true })
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
  renderer.outputEncoding = THREE.sRGBEncoding
  renderer.shadowMap.enabled = true
  renderer.shadowMap.type = THREE.PCFSoftShadowMap
  const escena = new THREE.Scene()
  escena.background = new THREE.Color(0x11161c)

  const camara = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 400)
  let zoomBase = 1
  const controles = new THREE.OrbitControls(camara, lienzo)
  controles.enableDamping = true
  controles.dampingFactor = 0.08
  controles.minPolarAngle = 0.35
  controles.maxPolarAngle = 1.15
  controles.minZoom = 0.6
  controles.maxZoom = 4
  controles.screenSpacePanning = false

  function vistaGeneral(animar = true) {
    const destino = new THREE.Vector3(19, 0, 12.5)
    const pos = destino.clone().add(new THREE.Vector3(-26, 30, 30))
    moverCamara(pos, destino, 1.15, animar)
  }
  let transicion = null
  function moverCamara(pos, objetivo, zoom, animar) {
    if (!animar || reducido) {
      camara.position.copy(pos); controles.target.copy(objetivo); camara.zoom = zoom; camara.updateProjectionMatrix(); return
    }
    transicion = { inicio: performance.now(), t: 0, p0: camara.position.clone(), p1: pos, o0: controles.target.clone(), o1: objetivo, z0: camara.zoom, z1: zoom }
  }

  function ajustar() {
    const r = escenaEl.getBoundingClientRect()
    renderer.setSize(r.width, r.height, false)
    const aspecto = r.width / r.height
    const alto = Math.max(28, 46 / aspecto)   // que quepa todo el edificio también en vertical
    camara.left = -alto * aspecto / 2; camara.right = alto * aspecto / 2
    camara.top = alto / 2; camara.bottom = -alto / 2
    camara.updateProjectionMatrix()
  }
  new ResizeObserver(ajustar).observe(escenaEl)

  // Luz
  const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x3a3028, 0.55)
  escena.add(hemi)
  const sol = new THREE.DirectionalLight(0xfff1dc, 0.95)
  sol.position.set(-12, 30, 8)
  sol.target.position.set(19, 0, 12)
  sol.castShadow = true
  sol.shadow.mapSize.set(2048, 2048)
  Object.assign(sol.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 90 })
  sol.shadow.bias = -0.0005
  escena.add(sol, sol.target)

  // ───────────────────────── Materiales y texturas ─────────────────────────
  function lienzoTextura(w, h, pintar) {
    const c = document.createElement('canvas'); c.width = w; c.height = h
    pintar(c.getContext('2d'), w, h)
    const t = new THREE.CanvasTexture(c)
    t.encoding = THREE.sRGBEncoding
    t.anisotropy = 4
    return t
  }
  const azar = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647 })()
  const TEX = {
    roble: lienzoTextura(256, 256, (g, w, h) => {
      g.fillStyle = '#6b4a33'; g.fillRect(0, 0, w, h)
      for (let y = 0; y < h; y += 32) for (let x = (y / 32 % 2) * 64; x < w + 128; x += 128) {
        g.fillStyle = `hsl(25, 32%, ${24 + azar() * 8}%)`; g.fillRect(x, y + 1, 126, 30)
        g.strokeStyle = 'rgba(0,0,0,.12)'; for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(x, y + 6 + k * 6); g.lineTo(x + 126, y + 6 + k * 6 + azar() * 2); g.stroke() }
      }
    }),
    claro: lienzoTextura(256, 256, (g, w, h) => {
      g.fillStyle = '#b89a78'; g.fillRect(0, 0, w, h)
      for (let y = 0; y < h; y += 32) for (let x = (y / 32 % 2) * 64; x < w + 128; x += 128) { g.fillStyle = `hsl(30, 30%, ${55 + azar() * 7}%)`; g.fillRect(x, y + 1, 126, 30) }
    }),
    moqueta: lienzoTextura(128, 128, (g, w, h) => {
      g.fillStyle = '#6a625a'; g.fillRect(0, 0, w, h)
      for (let i = 0; i < 1600; i++) { g.fillStyle = `rgba(255,255,255,${azar() * .05})`; g.fillRect(azar() * w, azar() * h, 1, 1) }
    }),
    caucho: lienzoTextura(128, 128, (g, w, h) => {

  }
  function ruta(desde, hasta, salaDestino) {
    const sa = salaEn(desde.x, desde.z)
    if (sa === salaDestino) return [hasta]
    const pts = []
    if (sa !== 'pasillo') { const d = puertaDe(sa); pts.push({ x: d.x, z: d.z }, d.pasillo) }
    const d2 = puertaDe(salaDestino)
    pts.push(d2.pasillo, { x: d2.x, z: d2.z }, hasta)
    return pts
  }

  const etiquetas = document.getElementById('etiquetas')
  AGENTES.forEach(a => {
    const modelo = crearPersona(a)
    const etq = document.createElement('div')
    etq.className = 'etq'
    etq.innerHTML = '<i></i><span></span>'
    etq.querySelector('span').textContent = a.nombre
    etq.addEventListener('click', () => seleccionar(a.id, true))
    etiquetas.append(etq)
    const puestoA = PUESTOS[a.id]
    const p = {
      ...a, ...modelo, etq,
      x: puestoA.x + Math.sin(puestoA.rot) * 0.75, z: puestoA.z + Math.cos(puestoA.rot) * 0.75, rot: puestoA.rot,
      camino: [], sitio: null, pose: 'sentado', estado: 'descanso', espera: Math.random() * 4, fase: Math.random() * 6,
      enPuesto: true,
      lugarTexto() {
        if (this.camino.length) return 'de camino'
        if (this.enPuesto) return SALAS[PUESTOS[this.id].sala].nombre.toLowerCase().replace('sala de operaciones', 'en su mesa')
        return this.sitio ? `${this.sitio.que} (${SALAS[this.sitio.sala].nombre.toLowerCase()})` : ''
      },
    }
    personas.push(p)
  })

  const asiento = s => ({ x: s.x + Math.sin(s.rot) * 0.75, z: s.z + Math.cos(s.rot) * 0.75 })
  function irA(p, destino, sala, pose, rotFinal) {
    p.camino = ruta({ x: p.x, z: p.z }, destino, sala)
    p.poseFinal = pose
    p.rotFinal = rotFinal
    p.pose = 'caminando'
  }
  function decidir(p) {
    if (p.estado !== 'descanso') {
      const s = PUESTOS[p.id]
      p.sitio = null
      if (!p.enPuesto) { irA(p, asiento(s), s.sala, 'sentado', s.rot); p.yendoAPuesto = true }
      return
    }
    const libres = SITIOS.filter(s => !personas.some(o => o !== p && o.sitio === s))
    const s = libres[Math.floor(Math.random() * libres.length)]
    if (!s) return
    p.sitio = s; p.enPuesto = false; p.yendoAPuesto = false
    irA(p, { x: s.x, z: s.z }, s.sala, s.pose, s.rot)
  }

  // ───────────────────────── Mascotas ─────────────────────────
  function crearPerro() {
    const g = new THREE.Group(), pelaje = mat(0xb07a45), oscuro = mat(0x5a3a22)
    const torso = caja(0.32, 0.26, 0.62, pelaje, 0, 0.42, 0, g)
    const cab = caja(0.24, 0.24, 0.26, pelaje, 0, 0.62, -0.38, g)
    caja(0.12, 0.1, 0.14, oscuro, 0, 0.56, -0.54, g)
    caja(0.06, 0.14, 0.08, oscuro, -0.1, 0.74, -0.36, g); caja(0.06, 0.14, 0.08, oscuro, 0.1, 0.74, -0.36, g)
    const patas = [[-0.1, -0.2], [0.1, -0.2], [-0.1, 0.2], [0.1, 0.2]].map(([x, z]) => caja(0.07, 0.3, 0.07, pelaje, x, 0.15, z, g))
    const cola = caja(0.05, 0.05, 0.28, pelaje, 0, 0.55, 0.38, g); cola.rotation.x = -0.6
    escena.add(g)
    return { g, patas, cola, cab, tipo: 'perro', x: 30, z: 23.4, destino: null, espera: 1, fase: 0, vel: 1.4, zona: { x0: 22, x1: 37, z0: 21.5, z1: 24.5 } }
  }
  function crearGato() {
    const g = new THREE.Group(), pelaje = mat(0x6b6e78)
    caja(0.18, 0.16, 0.4, pelaje, 0, 0.22, 0, g)
    caja(0.15, 0.14, 0.14, pelaje, 0, 0.32, -0.24, g)
    const o1 = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.08, 4), pelaje); o1.position.set(-0.05, 0.42, -0.24); g.add(o1)
    const o2 = o1.clone(); o2.position.x = 0.05; g.add(o2)
    const patas = [[-0.06, -0.12], [0.06, -0.12], [-0.06, 0.12], [0.06, 0.12]].map(([x, z]) => caja(0.04, 0.14, 0.04, pelaje, x, 0.07, z, g))
    const cola = caja(0.035, 0.035, 0.32, pelaje, 0, 0.3, 0.32, g); cola.rotation.x = -0.9
    g.traverse(o => { if (o.isMesh) o.castShadow = true })
    escena.add(g)
    return { g, patas, cola, tipo: 'gato', x: 3.0, z: 21.8, destino: null, espera: 10, fase: 0, vel: 0.7, zona: { x0: 1, x1: 12, z0: 16.5, z1: 23.5 }, altura: 0.54 }
  }
  const mascotas = [crearPerro(), crearGato()]

  // ───────────────────────── Bucle ─────────────────────────
  function animarPersona(p, dt, t) {
    // Moverse por el camino
    if (p.camino.length) {
      const obj = p.camino[0]
      const dx = obj.x - p.x, dz = obj.z - p.z, d = Math.hypot(dx, dz)
      const vel = p.estado === 'alerta' ? 2.6 : 1.3
      if (d < 0.05) {
        p.camino.shift()
        if (!p.camino.length) {
          p.pose = p.poseFinal; p.rot = p.rotFinal ?? p.rot
          if (p.yendoAPuesto) { p.enPuesto = true; p.yendoAPuesto = false }
          pintarPanelSuave()
        }
      } else {
        const paso = Math.min(d, vel * dt)
        p.x += dx / d * paso; p.z += dz / d * paso
        const objetivo = Math.atan2(-dx, -dz)
        let dif = objetivo - p.rot
        while (dif > Math.PI) dif -= 2 * Math.PI
        while (dif < -Math.PI) dif += 2 * Math.PI
        p.rot += dif * Math.min(1, dt * 10)
        p.fase += dt * vel * 4.2
      }
    } else {
      p.espera -= dt
      if (p.espera <= 0) {
        p.espera = p.estado === 'descanso' ? 14 + Math.random() * 16 : 3
        if (p.estado === 'descanso' || !p.enPuesto) decidir(p)
      }
    }

    // Pose
    const r = p.raiz, c = p.cuerpo
    r.position.set(p.x, 0, p.z); r.rotation.y = p.rot
    c.position.set(0, 0, 0); c.rotation.set(0, 0, 0)
    p.piernas.forEach(l => l.rotation.set(0, 0, 0)); p.brazos.forEach(b => b.rotation.set(0, 0, 0))
    const mov = reducido ? 0 : 1
    switch (p.pose) {
      case 'caminando':
      case 'andando': {
        const s = Math.sin(p.pose === 'andando' ? t * 6 : p.fase) * 0.55 * mov
        p.piernas[0].rotation.x = s; p.piernas[1].rotation.x = -s
        p.brazos[0].rotation.x = -s * 0.8; p.brazos[1].rotation.x = s * 0.8
        c.position.y = Math.abs(Math.cos(p.pose === 'andando' ? t * 6 : p.fase)) * 0.03 * mov
        if (p.pose === 'andando') c.position.y += 0.22
        break
      }
      case 'sentado': {
        c.position.y = -0.44
        p.piernas.forEach(l => { l.rotation.x = Math.PI / 2 })
        if (p.enPuesto) {
          c.position.z = 0.0
          const tecleo = p.estado !== 'descanso' ? Math.sin(t * 14 + p.fase) * 0.06 * mov : 0
          p.brazos[0].rotation.x = 1.15 + tecleo; p.brazos[1].rotation.x = 1.15 - tecleo
        } else {
          p.brazos[0].rotation.x = 0.3; p.brazos[1].rotation.x = 0.3
        }
        break
      }
      case 'de pie': {
        p.brazos[1].rotation.x = 1.2 + Math.sin(t * 0.8 + p.fase) * 0.15 * mov    // taza o estiramiento
        c.position.y = Math.sin(t * 1.4 + p.fase) * 0.005
        break
      }
      case 'tumbado': {
        c.rotation.x = Math.PI / 2 - 0.35; c.position.set(0, 0.42, -0.85)
        p.brazos.forEach(b => { b.rotation.x = 0.1 })
        break
      }
      case 'nadando': {
        c.rotation.x = -Math.PI / 2 + 0.25; c.position.set(0, 0.05, 0.85)
        const s = Math.sin(t * 2.4 + p.fase) * mov
        p.brazos[0].rotation.x = Math.PI * 0.9 + s; p.brazos[1].rotation.x = Math.PI * 0.9 - s
        p.piernas[0].rotation.x = s * 0.25; p.piernas[1].rotation.x = -s * 0.25
        if (!reducido) { p.x += Math.sin(t * 0.25 + p.fase) * dt * 0.4 }
        break
      }
    }
    p.anillo.visible = seleccionado === p.id
  }

  function animarMascota(m, dt, t) {
    if (m.destino) {
      const dx = m.destino.x - m.x, dz = m.destino.z - m.z, d = Math.hypot(dx, dz)
      if (d < 0.05) m.destino = null
      else {
        const paso = Math.min(d, m.vel * dt); m.x += dx / d * paso; m.z += dz / d * paso
        m.g.rotation.y = Math.atan2(-dx, -dz)
        m.fase += dt * 12
      }
    } else {
      m.espera -= dt
      if (m.espera <= 0) {
        m.espera = m.tipo === 'gato' ? 12 + Math.random() * 14 : 2 + Math.random() * 5
        const z = m.zona
        m.destino = { x: z.x0 + Math.random() * (z.x1 - z.x0), z: z.z0 + Math.random() * (z.z1 - z.z0) }
        if (m.tipo === 'gato' && Math.random() < 0.5) m.destino = { x: 3.0, z: 21.8 }   // vuelve al sofá
      }
    }
    const andando = !!m.destino && !reducido
    m.patas.forEach((p, i) => { p.rotation.x = andando ? Math.sin(m.fase + (i % 2) * Math.PI) * 0.5 : 0 })
    m.cola.rotation.y = m.tipo === 'perro' ? Math.sin(t * (andando ? 12 : 5)) * 0.5 * (reducido ? 0 : 1) : Math.sin(t * 1.2) * 0.3 * (reducido ? 0 : 1)
    const enSofa = m.tipo === 'gato' && !m.destino && Math.hypot(m.x - 3.0, m.z - 21.8) < 0.1
    m.g.position.set(m.x, enSofa ? m.altura : 0, m.z)
  }

  const v = new THREE.Vector3()
  function posicionarEtiquetas() {
    const r = escenaEl.getBoundingClientRect()
    for (const p of personas) {
      const alto = p.pose === 'tumbado' ? 1.0 : p.pose === 'nadando' ? 0.7 : p.pose === 'sentado' ? 1.75 : 2.15
      v.set(p.x, alto, p.z).project(camara)
      const fuera = v.z > 1 || Math.abs(v.x) > 1.05 || Math.abs(v.y) > 1.05
      p.etq.style.display = fuera ? 'none' : 'flex'
      p.etq.style.left = `${(v.x + 1) / 2 * r.width}px`
      p.etq.style.top = `${(1 - v.y) / 2 * r.height}px`
      p.etq.className = `etq ${p.estado}${seleccionado === p.id ? ' sel' : ''}`
      p.etq.style.zIndex = String(Math.round((1 - v.z) * 1000))
    }
  }

  function luzDelDia() {
    const h = Number(new Intl.DateTimeFormat('es-ES', { hour: 'numeric', hourCycle: 'h23', timeZone: 'Europe/Madrid' }).format(new Date()))
    const noche = h < 8 || h >= 20
    sol.intensity = noche ? 0.35 : 0.95
    sol.color.set(noche ? 0x9fb2d6 : 0xfff1dc)
    hemi.intensity = noche ? 0.4 : 0.55
  }
  luzDelDia(); setInterval(luzDelDia, 60_000)

  let ultimo = performance.now()
  function bucle(ahora) {
    const dt = Math.min(0.05, (ahora - ultimo) / 1000); ultimo = ahora
    const t = ahora / 1000
    if (transicion) {
      transicion.t = Math.min(1, (ahora - transicion.inicio) / 900)
      const e = transicion.t < .5 ? 2 * transicion.t ** 2 : 1 - (-2 * transicion.t + 2) ** 2 / 2
      camara.position.lerpVectors(transicion.p0, transicion.p1, e)
      controles.target.lerpVectors(transicion.o0, transicion.o1, e)
      camara.zoom = transicion.z0 + (transicion.z1 - transicion.z0) * e
      camara.updateProjectionMatrix()
      if (transicion.t >= 1) transicion = null
    }
    if (!reducido) { TEX.agua.offset.x = (t * 0.02) % 1; TEX.agua.offset.y = Math.sin(t * 0.3) * 0.02 }
    personas.forEach(p => animarPersona(p, dt, t))
    mascotas.forEach(m => animarMascota(m, dt, t))
    controles.update()
    renderer.render(escena, camara)
    posicionarEtiquetas()
    requestAnimationFrame(bucle)
  }

  // ───────────────────────── Interacción ─────────────────────────
  const rayo = new THREE.Raycaster(), puntero = new THREE.Vector2()
  let abajo = null
  lienzo.addEventListener('pointerdown', e => { abajo = { x: e.clientX, y: e.clientY } })
  lienzo.addEventListener('pointerup', e => {
    if (!abajo || Math.hypot(e.clientX - abajo.x, e.clientY - abajo.y) > 5) return
    const r = lienzo.getBoundingClientRect()
    puntero.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1)
    rayo.setFromCamera(puntero, camara)
    const golpe = rayo.intersectObjects(personas.map(p => p.raiz), true).find(h => h.object.userData.persona)
    if (golpe) seleccionar(golpe.object.userData.persona, false)
  })

  function seleccionar(id, enfocar) {
    seleccionado = seleccionado === id && !enfocar ? null : id
    const p = personas.find(p => p.id === id)
    if (enfocar && p) {
      const objetivo = new THREE.Vector3(p.x, 0.8, p.z)
      const desplaz = camara.position.clone().sub(controles.target)
      moverCamara(objetivo.clone().add(desplaz), objetivo, 2.4, true)
    }
    pintarPanel()
    document.getElementById(`agente-${id}`)?.scrollIntoView({ block: 'nearest' })
  }

  document.getElementById('centrar').addEventListener('click', () => { seleccionado = null; vistaGeneral(); pintarPanel(); marcarVista(null) })
  function girar(ang) {
    const off = camara.position.clone().sub(controles.target)
    off.applyAxisAngle(new THREE.Vector3(0, 1, 0), ang)
    moverCamara(controles.target.clone().add(off), controles.target.clone(), camara.zoom, true)
  }
  document.getElementById('girar-izq').addEventListener('click', () => girar(Math.PI / 4))
  document.getElementById('girar-der').addEventListener('click', () => girar(-Math.PI / 4))

  // Botones de salas
  const vistas = document.getElementById('vistas')
  function marcarVista(k) { vistas.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sala === k))) }
  for (const [k, s] of Object.entries(SALAS)) {
    const b = document.createElement('button')
    b.type = 'button'; b.textContent = s.nombre; b.dataset.sala = k; b.id = `sala-${k}`
    b.addEventListener('click', () => {
      const objetivo = new THREE.Vector3((s.x0 + s.x1) / 2, 0.5, (s.z0 + s.z1) / 2)
      const desplaz = camara.position.clone().sub(controles.target)
      const ancho = Math.max(s.x1 - s.x0, s.z1 - s.z0)
      moverCamara(objetivo.clone().add(desplaz), objetivo, Math.min(3, 28 / ancho), true)
      marcarVista(k)
    })
    vistas.append(b)
  }

  // ───────────────────────── Datos en vivo ─────────────────────────
  let pendientePanel = false
  function pintarPanelSuave() { if (!pendientePanel) { pendientePanel = true; setTimeout(() => { pendientePanel = false; pintarPanel() }, 300) } }

  function aplicar(nuevo) {
    datos = nuevo
    for (const p of personas) {
      const { estado } = estadoDe(p.id)
      const cambia = estado !== p.estado
      p.estado = estado
      for (const m of pantallas[p.id] ?? []) { m.map = m.emissiveMap = TEX_PANTALLA[estado]; m.emissiveIntensity = estado === 'descanso' ? 0.25 : 0.6; m.needsUpdate = true }
      if (cambia) { p.espera = 0; decidir(p) }
    }
    pintarPanel()
  }

  async function cargar() {
    try {
      const r = await fetch('estado', { cache: 'no-store' })
      if (!r.ok) throw new Error(String(r.status))
      aplicar(await r.json())
    } catch {
      if (datos === EJEMPLO) aplicar(EJEMPLO)
    }
  }

  // Arranque: cada uno ya en su sitio
  ajustar()
  vistaGeneral(false)
  aplicar(EJEMPLO)
  for (const p of personas) {
    if (p.estado === 'descanso') decidir(p)
    if (p.camino.length) {
      const fin = p.camino[p.camino.length - 1]
      p.x = fin.x; p.z = fin.z; p.camino = []; p.pose = p.poseFinal; p.rot = p.rotFinal ?? p.rot
      if (p.yendoAPuesto) { p.enPuesto = true; p.yendoAPuesto = false }
    }
  }
  pintarPanel()
  cargar()
  setInterval(cargar, 30_000)
  requestAnimationFrame(bucle)
})()
</script>
